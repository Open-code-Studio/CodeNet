name: Build CodeNet Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Target OS'
        required: true
        default: 'osx'
        type: choice
        options:
          - osx
          - linux
          - win
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - x64
          - arm

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_os == 'osx' || github.event_name != 'workflow_dispatch' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          brew install cmake ninja icu4c

      - name: Build .NET Runtime for macOS arm64
        run: |
          ./build.sh -arch ${{ matrix.arch }} -os osx -c Release \
            --subset clr+libs \
            --ninja \
            /p:TargetOS=osx \
            /p:TargetArchitecture=${{ matrix.arch }} \
            /p:Configuration=Release

      - name: Verify build output
        run: |
          RUNTIME_DIR=$(find artifacts/bin/runtime/Release -maxdepth 2 -type d -name "osx-${{ matrix.arch }}" 2>/dev/null | head -1)
          if [ -z "$RUNTIME_DIR" ]; then
            echo "Build output not found in expected location"
            echo "Contents of artifacts/bin:"
            find artifacts/bin -maxdepth 4 -type d 2>/dev/null || echo "artifacts/bin does not exist"
            exit 1
          fi
          echo "Runtime output found at: $RUNTIME_DIR"
          echo "RUNTIME_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"

      - name: Package Runtime
        run: |
          mkdir -p artifacts/package
          tar czf artifacts/package/dotnet-runtime-osx-${{ matrix.arch }}.tar.gz \
            -C "$RUNTIME_DIR" .

      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-runtime-osx-${{ matrix.arch }}
          path: artifacts/package/dotnet-runtime-osx-${{ matrix.arch }}.tar.gz

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_os == 'linux' || false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Build .NET Runtime for Linux ${{ matrix.arch }}
        run: |
          ./build.sh -arch ${{ matrix.arch }} -os linux -c Release \
            --subset clr+libs \
            --ninja \
            /p:TargetOS=linux \
            /p:TargetArchitecture=${{ matrix.arch }} \
            /p:Configuration=Release

      - name: Verify build output
        run: |
          RUNTIME_DIR=$(find artifacts/bin/runtime/Release -maxdepth 2 -type d -name "linux-${{ matrix.arch }}" 2>/dev/null | head -1)
          if [ -z "$RUNTIME_DIR" ]; then
            echo "Build output not found in expected location"
            exit 1
          fi
          echo "RUNTIME_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"

      - name: Package Runtime
        run: |
          mkdir -p artifacts/package
          tar czf artifacts/package/dotnet-runtime-linux-${{ matrix.arch }}.tar.gz \
            -C "$RUNTIME_DIR" .

      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-runtime-linux-${{ matrix.arch }}
          path: artifacts/package/dotnet-runtime-linux-${{ matrix.arch }}.tar.gz

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_os == 'win' || false }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Build .NET Runtime for Windows ${{ matrix.arch }}
        run: |
          .\build.cmd -arch ${{ matrix.arch }} -os win -c Release `
            --subset clr+libs `
            /p:TargetOS=win `
            /p:TargetArchitecture=${{ matrix.arch }} `
            /p:Configuration=Release

      - name: Verify build output
        run: |
          $runtimeDir = Get-Item "artifacts\bin\runtime\Release\*\win-${{ matrix.arch }}" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtimeDir) {
            Write-Host "Build output not found in expected location"
            Get-ChildItem "artifacts\bin" -Recurse -Directory -Depth 4 | Select-Object -First 50
            exit 1
          }
          Write-Host "Runtime output found at: $($runtimeDir.FullName)"
          "RUNTIME_DIR=$($runtimeDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package Runtime
        run: |
          mkdir artifacts\package -Force
          Compress-Archive -Path "$env:RUNTIME_DIR\*" `
            -DestinationPath artifacts\package\dotnet-runtime-win-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-runtime-win-${{ matrix.arch }}
          path: artifacts\package\dotnet-runtime-win-${{ matrix.arch }}.zip
